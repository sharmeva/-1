<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сбер Здоровье — прототип</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{--g:#21A038;--pk:#E91E63;--bg:#F2F4F5;--card:#fff;--tx:#1F2328;--mu:#6B7280;--ln:#E5E8EB;--gl:#E6F4EA;--rb:#FDE8E8;--rt:#D93025;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1214;--card:#1b1f22;--tx:#eef1f3;--mu:#9aa3ab;--ln:#2a3034;--gl:#17301d;--rb:#3a1a1a;--rt:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1214;--card:#1b1f22;--tx:#eef1f3;--mu:#9aa3ab;--ln:#2a3034;--gl:#17301d;--rb:#3a1a1a;--rt:#ff8a80;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
#screen{flex:1;overflow-y:auto;padding:12px 16px 20px}
h1{font-size:21px;margin-bottom:12px}h2{font-size:17px;margin:18px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 4px;background:var(--card)}
.logo{font-size:17px;display:flex;gap:6px;align-items:center}.lg{background:var(--g);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px}
.cb{position:relative;font-size:22px;cursor:pointer}.cb em{position:absolute;top:-6px;right:-10px;background:var(--pk);color:#fff;font:600 11px/1 sans-serif;border-radius:9px;padding:3px 5px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:8px}
.sec{background:var(--card);padding:6px 16px 8px;margin:0;border-bottom:1px solid var(--ln)}
.chip{flex:none;border-radius:20px;padding:7px 13px;font-size:14px;cursor:pointer;background:var(--bg);white-space:nowrap}
.sec .chip{background:none;padding:6px 4px;font-weight:600;border-radius:0}
.chip.on{background:var(--g);color:#fff}.sec .chip.on{background:none;color:var(--g);box-shadow:0 2px 0 var(--g)}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:12px}
.search input{border:0;outline:0;background:none;flex:1;font:inherit;color:var(--tx);min-width:0}
.promo{background:linear-gradient(135deg,var(--g),#107F8C);color:#fff;border-radius:18px;padding:18px}
.hero{background:linear-gradient(135deg,#2b1a4a,#c2185b 60%,#ff5c93);color:#fff;border-radius:20px;padding:14px;margin-bottom:12px}
.hero h1{font-size:19px;text-align:center;margin:16px 0}.hr{display:flex;gap:8px;flex-wrap:wrap}
.wh{background:#fff;color:#1F2328;border-radius:12px;padding:8px 12px;font-size:14px;cursor:pointer}
.labs{display:flex;justify-content:space-around;font:italic 700 13px sans-serif;opacity:.85;flex-wrap:wrap;gap:6px}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:600 15px inherit;font-family:inherit;width:100%;cursor:pointer}
.btn.s{background:var(--gl);color:var(--g);width:auto;padding:8px 12px;font-size:13px;margin:0 6px 6px 0}
.btn.w{background:#fff;color:var(--g);width:auto;margin-top:12px;padding:9px 16px}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.q{background:var(--card);border-radius:14px;padding:12px 4px;text-align:center;font-size:12px;cursor:pointer}
.q i{display:block;font-style:normal;font-size:24px;margin-bottom:4px}
.doc{display:flex;gap:12px;cursor:pointer}
.av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--gl);display:grid;place-items:center;font-size:26px}
.doc b{display:block}.price{color:var(--g);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--ln);cursor:pointer;gap:10px}
.row:last-child{border:0}
.tag{display:inline-block;background:var(--gl);color:var(--g);border-radius:8px;padding:2px 8px;font-size:12px;white-space:nowrap}
.tag.bad{background:var(--rb);color:var(--rt)}
.tabs{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:12px}
.tabs div{flex:1;text-align:center;padding:8px 2px;border-radius:10px;cursor:pointer;font-size:13px}
.tabs .on{background:var(--g);color:#fff}
nav{display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 0 4px}
nav div{flex:1;text-align:center;font-size:11px;color:var(--mu);cursor:pointer}
nav div i{display:block;font-style:normal;font-size:22px;filter:grayscale(1);opacity:.7}
nav .on{color:var(--g);font-weight:600}nav .on i{filter:none;opacity:1}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:5;overflow-y:auto;padding:14px 16px 24px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.back{color:var(--g);cursor:pointer;margin-bottom:10px;display:inline-block}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer}
.slot.on{background:var(--g);border-color:var(--g);color:#fff}
.toast{position:absolute;left:16px;right:16px;bottom:80px;background:#1F2328;color:#fff;border-radius:12px;padding:12px 14px;z-index:9;text-align:center}
select,.in{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px;font:inherit;margin-bottom:8px}
.f3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{flex:none;width:44px;height:26px;border-radius:13px;background:var(--ln);position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--g)}.sw.on::after{left:21px}
.up{color:var(--g)}.dn{color:var(--rt)}
.b{max-width:88%;padding:10px 12px;border-radius:16px;margin-bottom:10px;white-space:pre-wrap}
.b.u{background:var(--g);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.b.a{background:var(--card);border-bottom-left-radius:4px}
.dis{margin-top:8px;padding-top:6px;border-top:1px solid var(--ln);font-size:12px;color:#B26A00}
.warn{background:#FFF4E0;color:#7a4b00;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.ask{display:flex;gap:8px;position:sticky;bottom:-20px;background:var(--bg);padding:8px 0}
.ask input{flex:1;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:22px;padding:11px 16px;font:inherit;min-width:0}
.ask button{width:44px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:18px}
.login{position:absolute;inset:0;z-index:20;background:#E3EAFB;overflow-y:auto;display:none;padding-top:env(safe-area-inset-top,0px)}
.lw{padding:16px}.lhero{color:#1F2D5A;margin-bottom:14px}.lhero h1{font-size:28px;margin-bottom:8px;line-height:1.15}
.lcard{background:var(--card);border-radius:20px;padding:16px}
.lben{box-shadow:0 2px 10px rgba(0,0,0,.08);border-radius:14px;padding:12px;margin-top:12px;font-size:14px;display:grid;gap:6px}
.lbtn{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:14px;font:600 15px inherit;font-family:inherit;margin-bottom:10px;cursor:pointer}
.lhint{background:var(--card);border:1px dashed var(--g);border-radius:14px;padding:12px;font-size:13px;margin-top:10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .login{background:#141a2b}:root:not([data-theme="light"]) .lhero{color:#dfe7ff}}
body{font-family:"SB Sans Text","SB Sans Display","Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
select,input,button,textarea{font-family:inherit}
h1{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
h2{font-size:19px;font-weight:700;margin:24px 0 12px;letter-spacing:-.01em}
#screen{padding:16px 16px 28px}
.card{border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.05)}
.top{padding:12px 16px 6px}.logo{font-size:18px;font-weight:700;letter-spacing:.01em}.lg{width:26px;height:26px;font-size:15px}
.sec{padding:4px 16px 0;gap:18px}.sec .chip{padding:10px 2px;font-size:14px;font-weight:600;color:var(--mu)}.sec .chip.on{color:var(--tx);box-shadow:0 3px 0 var(--g)}
.promo{border-radius:24px;padding:22px;position:relative;overflow:hidden}.promo::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14)}
.btn{border-radius:14px;padding:14px 18px;font-weight:600;box-shadow:0 2px 8px rgba(33,160,56,.25);transition:transform .1s}.btn:active{transform:scale(.98)}.btn.s,.btn.w{box-shadow:none}
.grid{gap:10px}.q{border-radius:18px;padding:14px 6px;font-weight:500;box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05)}
.q i{width:46px;height:46px;border-radius:15px;background:var(--gl);display:grid;place-items:center;margin:0 auto 8px;font-size:23px}
.av{background:linear-gradient(135deg,var(--gl),#cfeadb)}
.tag{border-radius:20px;padding:3px 10px;font-weight:600}
.tabs{border-radius:14px;padding:4px;box-shadow:0 1px 2px rgba(16,24,40,.05)}.tabs div{padding:9px 2px;font-weight:600}
nav{padding:8px 0 6px;border:0;box-shadow:0 -4px 20px rgba(16,24,40,.07)}
nav div i{width:54px;height:30px;line-height:30px;border-radius:15px;margin:0 auto 2px;font-size:20px}nav .on i{background:var(--gl)}
.search{border-radius:16px;padding:13px 16px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05)}
select,.in{border-radius:12px;padding:11px 12px}.in:focus,select:focus{outline:2px solid var(--g);outline-offset:-1px}
.ib{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gl);color:var(--g);cursor:pointer;vertical-align:middle;margin-left:4px;font-size:14px}
.b{border-radius:18px}.hero{border-radius:24px;padding:16px}.wh{border-radius:14px;font-weight:600}.row{padding:14px 0}.chip{font-weight:500}
.drop{display:block;border:1.5px dashed var(--g);border-radius:16px;padding:16px;text-align:center;cursor:pointer;background:var(--gl);font-weight:600}
.drop .mu{font-weight:400;margin-top:4px}
.pfb .chip{background:var(--card)}.pfb .chip.on{background:var(--g)}
.ph{display:flex;gap:8px;margin-bottom:4px}.ph select{width:auto;flex:none;margin:0}.ph .in{margin:0;flex:1;min-width:0}
.push{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;background:rgba(255,255,255,.97);color:#1F2328;border-radius:18px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.22);display:flex;gap:10px;font-size:14px;cursor:pointer;animation:pd .35s ease}
.push .pi{width:36px;height:36px;border-radius:10px;background:var(--g);display:grid;place-items:center;flex:none}
@keyframes pd{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
.btn svg{margin-right:6px;vertical-align:-5px}
</style>
</head>

function idbDelAcc(acc){return idb().then(function(d){return new Promise(function(ok){var tx=d.transaction('f','readwrite'),c=tx.objectStore('f').openCursor();c.onsuccess=function(){var k=c.result;if(k){if(k.value.acc===acc)k.delete();k.continue()}};tx.oncomplete=ok;tx.onerror=ok})})}
